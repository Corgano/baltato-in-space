name: Fix integrated script order

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fix cross-module Luck helper
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          js = Path('src/js')
          upgrades = js / '03-upgrades.js'
          game = js / '04-game-manager.js'

          text = upgrades.read_text(encoding='utf-8')
          helper = '''\n\n/* INTEGRATED: shared Luck curve helper */\nfunction balttatoLuckCurve(luck, cap = 1) {\n  return cap * (1 - Math.exp(-BALTTATO_LUCK_CURVE_RATE * Math.max(0, Number(luck) || 0)));\n}\n'''
          if '/* INTEGRATED: shared Luck curve helper */' not in text:
              text = text.replace('/* INTEGRATED: upgrade rarity, Joker recurrence, and Luck offering curves */', helper + '\n/* INTEGRATED: upgrade rarity, Joker recurrence, and Luck offering curves */', 1)
          upgrades.write_text(text, encoding='utf-8')

          game_text = game.read_text(encoding='utf-8')
          game_text = re.sub(r'\nfunction balttatoLuckCurve\(luck, cap = 1, rate = 0\.2\) \{\n  return cap \* \(1 - Math\.exp\(-rate \* Math\.max\(0, Number\(luck\) \|\| 0\)\)\);\n\}\n', '\n', game_text, count=1)
          game.write_text(game_text, encoding='utf-8')
          PY

      - name: Build
        run: python3 tools/build.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Fix integrated module dependency order" || exit 0
          git push origin main
