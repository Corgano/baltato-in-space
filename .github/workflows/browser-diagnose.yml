name: Browser runtime diagnostic

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: python3 tools/build.py

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run browser smoke test
        shell: bash
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/baltato-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1200, height: 1000 } });
            const errors = [];
            const consoleErrors = [];

            page.on('pageerror', err => errors.push(String(err.stack || err)));
            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await page.waitForTimeout(1000);

            const result = await page.evaluate(() => {
              const canvas = document.getElementById('gameCanvas');
              const game = window.__arenaGameInstance;
              if (!canvas) return { canvas: false, game: false };
              const ctx = canvas.getContext('2d');
              const sample = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
              let nonTransparent = 0;
              let nonBlack = 0;
              for (let i = 0; i < sample.length; i += 4) {
                if (sample[i + 3] > 0) nonTransparent++;
                if (sample[i] > 5 || sample[i + 1] > 5 || sample[i + 2] > 5) nonBlack++;
              }
              return {
                canvas: true,
                width: canvas.width,
                height: canvas.height,
                game: Boolean(game),
                state: game ? game.state : null,
                player: game ? { x: game.player?.x, y: game.player?.y } : null,
                nonTransparent,
                nonBlack
              };
            });

            console.log(JSON.stringify({ result, errors, consoleErrors }, null, 2));
            await page.screenshot({ path: '/tmp/baltato-browser.png', fullPage: true });

            if (errors.length || consoleErrors.length) process.exitCode = 1;
            if (!result.game || !result.canvas || result.nonBlack < 1000) process.exitCode = 1;

            await browser.close();
          })();
          NODE

      - name: Remove diagnostic workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/browser-diagnose.yml
          git commit -m "Remove one-time browser diagnostic"
          git push
