name: Inspect game source

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split source into chunks
        run: |
          rm -rf debug_source
          mkdir debug_source
          split -d -a 3 -l 250 index.html debug_source/chunk-
          for f in debug_source/chunk-*; do mv "$f" "$f.txt"; done
          printf '%s\n' "$(wc -l < index.html)" > debug_source/line_count.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug_source
          git commit -m "Temporary source inspection chunks"
          git push
